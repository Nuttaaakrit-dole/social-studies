<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบสังคมศึกษา ชุดที่ 1 (สกร. ประถมศึกษา)</title>
<meta name="description" content="แบบทดสอบสังคมศึกษา ชุดที่ 1 จำนวน 20 ข้อ สำหรับนักศึกษา สกร. ระดับประถมศึกษา พร้อมระบบสรุปคะแนนและเฉลย">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#185FA5;--blue-dark:#0c447c;--blue-light:#E6F1FB;--blue-mid:#378ADD;
    --green:#3B6D11;--green-light:#EAF3DE;--green-mid:#97C459;
    --red:#A32D2D;--red-light:#FCEBEB;--red-mid:#F09595;
    --amber:#633806;--amber-light:#FAEEDA;
    --gray-bg:#f5f4f0;--gray-card:#fff;--gray-border:rgba(0,0,0,0.12);
    --gray-surface:#f0ede6;--text:#1a1a1a;--text-muted:#666;--text-hint:#999;
  }
  body{font-family:'Sarabun',sans-serif;background:var(--gray-bg);min-height:100vh;color:var(--text)}
  .wrap{max-width:680px;margin:0 auto;padding:16px}

  /* Header (ใช้โทนสีฟ้า-น้ำเงิน สำหรับชุดที่ 1) */
  .header{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);border-radius:18px;padding:24px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
  .header::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.07)}
  .header::after{content:'';position:absolute;bottom:-20px;right:40px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.05)}
  .badge{display:inline-block;background:rgba(255,255,255,0.2);border-radius:99px;padding:4px 14px;font-size:12px;font-weight:600;margin-bottom:10px;letter-spacing:.5px}
  .htitle{font-size:24px;font-weight:700;margin-bottom:5px}
  .hsub{font-size:14px;opacity:.85}

  /* Progress */
  .prog-card{background:var(--gray-card);border-radius:12px;border:1px solid var(--gray-border);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:16px}
  .prog-info{flex:1}
  .prog-lbl{font-size:12px;color:var(--text-muted);margin-bottom:6px}
  .prog-bg{background:var(--gray-surface);border-radius:99px;height:8px}
  .prog-fill{background:linear-gradient(90deg,var(--blue),var(--blue-mid));border-radius:99px;height:8px;transition:width .4s ease}
  .prog-right{text-align:right}
  .prog-num{font-size:14px;font-weight:700;color:var(--text)}
  .prog-sub{font-size:12px;color:var(--text-muted);margin-top:2px}

  /* Question card */
  .q-card{background:var(--gray-card);border-radius:18px;border:1px solid var(--gray-border);padding:24px;margin-bottom:14px}
  .q-badge{font-size:11px;color:var(--blue-mid);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
  .q-num-circle{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--blue-light);color:var(--blue);font-size:14px;font-weight:700;margin-bottom:12px}
  .q-text{font-size:18px;font-weight:600;line-height:1.65;margin-bottom:16px;color:var(--text)}
  .q-context{background:var(--gray-surface);border-left:3px solid var(--blue-mid);border-radius:0 10px 10px 0;padding:12px 16px;font-size:14px;color:var(--text-muted);margin-bottom:18px;font-style:italic;line-height:1.75}

  /* Choices */
  .choices{display:flex;flex-direction:column;gap:9px}
  .choice{background:var(--gray-card);border:1.5px solid var(--gray-border);border-radius:12px;padding:13px 16px;text-align:left;cursor:pointer;font-size:15px;font-family:'Sarabun',sans-serif;color:var(--text);transition:all .15s;display:flex;align-items:center;gap:12px;line-height:1.5;width:100%}
  .choice:hover:not(:disabled){background:var(--blue-light);border-color:var(--blue-mid);color:var(--blue)}
  .choice.selected{background:var(--blue-light);border-color:var(--blue);color:var(--blue);font-weight:500}
  .choice.correct{background:var(--green-light);border-color:var(--green);color:var(--green)}
  .choice.wrong{background:var(--red-light);border-color:var(--red);color:var(--red)}
  .choice:disabled{cursor:not-allowed}
  .cletter{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--gray-surface);color:var(--text-muted);transition:all .15s}
  .choice.selected .cletter{background:var(--blue);color:#fff}
  .choice.correct .cletter{background:var(--green);color:#fff}
  .choice.wrong .cletter{background:var(--red);color:#fff}

  /* Feedback */
  .feedback{border-radius:12px;padding:14px 16px;font-size:14px;margin-top:14px;line-height:1.7;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:var(--green-light);color:var(--green);border:1px solid var(--green-mid)}
  .feedback.no{background:var(--red-light);color:var(--red);border:1px solid var(--red-mid)}
  .feedback strong{font-weight:700}
  .fb-explain{font-size:13px;margin-top:6px;display:block;opacity:.85}

  /* Nav */
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
  .btn{padding:11px 26px;border-radius:10px;border:0;font-size:15px;font-weight:600;font-family:'Sarabun',sans-serif;cursor:pointer;transition:all .15s}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-dark)}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-secondary{background:var(--gray-surface);color:var(--text-muted);border:1px solid var(--gray-border)}
  .btn-secondary:hover{background:#e4e1d8}

  /* Dot nav */
  .dotnav{display:flex;gap:5px;flex-wrap:wrap;padding:4px 2px}
  .dot{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;transition:all .12s;border:none;font-family:'Sarabun',sans-serif}
  .dot-idle{background:var(--gray-surface);color:var(--text-muted)}
  .dot-active{background:var(--blue);color:#fff;transform:scale(1.1)}
  .dot-ok{background:var(--green);color:#fff}
  .dot-no{background:var(--red);color:#fff}

  /* Result */
  .result-wrap{background:var(--gray-card);border-radius:18px;border:1px solid var(--gray-border);padding:32px 24px;text-align:center}
  .result-icon{font-size:64px;margin-bottom:14px;display:block}
  .score-big{font-size:56px;font-weight:700;color:var(--blue);line-height:1}
  .score-denom{font-size:22px;color:var(--text-muted);margin-bottom:6px}
  .score-pct{font-size:20px;font-weight:600;color:var(--text);margin-bottom:8px}
  .grade-pill{display:inline-block;padding:5px 20px;border-radius:99px;font-size:14px;font-weight:700;margin-bottom:16px}
  .grade-A{background:var(--green-light);color:var(--green)}
  .grade-B{background:var(--blue-light);color:var(--blue-dark)}
  .grade-C{background:var(--amber-light);color:var(--amber)}
  .grade-D{background:var(--red-light);color:var(--red)}
  .result-msg{font-size:15px;color:var(--text-muted);margin-bottom:20px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 24px}
  .sbox{background:var(--gray-surface);border-radius:10px;padding:14px 8px;text-align:center}
  .snum{font-size:26px;font-weight:700}
  .snum.green{color:var(--green)}
  .snum.red{color:var(--red)}
  .snum.blue{color:var(--blue)}
  .slbl{font-size:12px;color:var(--text-muted);margin-top:3px}
  .btn-retry{background:var(--blue);color:#fff;padding:13px 36px;border-radius:12px;border:0;font-size:17px;font-weight:700;font-family:'Sarabun',sans-serif;cursor:pointer;margin-bottom:28px;transition:background .15s}
  .btn-retry:hover{background:var(--blue-dark)}

  /* Review */
  .review-title{font-size:17px;font-weight:700;padding-bottom:10px;border-bottom:1px solid var(--gray-border);margin-bottom:14px;text-align:left}
  .ri{padding:14px 0;border-bottom:1px solid var(--gray-border);text-align:left}
  .ri:last-child{border-bottom:none}
  .ri-q{font-size:14px;font-weight:600;margin-bottom:7px;line-height:1.55;display:flex;gap:8px;align-items:flex-start}
  .ri-tick{width:20px;height:20px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;margin-top:1px}
  .ri-ok{background:var(--green-light);color:var(--green)}
  .ri-no{background:var(--red-light);color:var(--red)}
  .ri-user{font-size:13px;color:var(--text-muted);margin-bottom:3px}
  .ri-correct{font-size:13px;color:var(--green);font-weight:600;margin-bottom:3px}
  .ri-exp{font-size:12px;color:var(--text-hint);line-height:1.6}

  /* Start screen */
  .start-wrap{background:var(--gray-card);border-radius:18px;border:1px solid var(--gray-border);padding:32px 24px;text-align:center}
  .start-icon{font-size:72px;display:block;margin-bottom:16px}
  .start-title{font-size:26px;font-weight:700;margin-bottom:8px}
  .start-sub{font-size:15px;color:var(--text-muted);line-height:1.75;margin-bottom:22px}
  .pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
  .pill{background:var(--blue-light);color:var(--blue);border-radius:99px;padding:5px 16px;font-size:13px;font-weight:600}
  .topic-box{background:var(--gray-surface);border-radius:12px;padding:16px;margin-bottom:24px;text-align:left}
  .topic-head{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text)}
  .topic-row{font-size:14px;color:var(--text-muted);padding:4px 0;display:flex;align-items:center;gap:9px}
  .topic-dot{width:7px;height:7px;border-radius:50%;background:var(--blue-mid);flex-shrink:0}
  .btn-start{background:var(--blue);color:#fff;padding:15px 48px;border-radius:14px;border:0;font-size:19px;font-weight:700;font-family:'Sarabun',sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(24,95,165,.3);transition:all .15s}
  .btn-start:hover{background:var(--blue-dark);transform:translateY(-2px)}

  @media(max-width:480px){
    .wrap{padding:10px}
    .htitle{font-size:20px}
    .q-text{font-size:16px}
    .choice{font-size:14px}
    .score-big{font-size:44px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="badge">สกร.โนนสัง • ระดับประถมศึกษา (ชุดที่ 1)</div>
    <div class="htitle">🌍 แบบทดสอบสังคมศึกษา</div>
    <div class="hsub">Social Studies Quiz 1 — 20 ข้อ • ตรวจคำตอบและสรุปผลอัตโนมัติ</div>
  </div>
  <div id="app"></div>
</div>

<script>
const Q=[
  {id:1,cat:"ศาสนา",q:"วันมาฆบูชา มีเหตุการณ์สำคัญใดเกิดขึ้นในทางพระพุทธศาสนา?",ctx:"",c:["พระสงฆ์ 1,250 รูปมาประชุมกันโดยมิได้นัดหมาย","พระพุทธเจ้าทรงแสดงปฐมเทศนา","พระพุทธเจ้าประสูติ ตรัสรู้ และปรินิพพาน","เป็นวันขึ้นปีใหม่ของชาวพุทธ"],a:0,exp:"วันมาฆบูชา (วันเพ็ญเดือน 3) เป็นวันที่พระสงฆ์สาวกจำนวน 1,250 รูป มาประชุมพร้อมกันโดยมิได้นัดหมาย หรือเรียกว่าวันจาตุรงคสันนิบาต"},
  {id:2,cat:"ศาสนา",q:"การทำความดี ละเว้นความชั่ว และทำจิตใจให้บริสุทธิ์ จัดเป็นหลักธรรมข้อใด?",ctx:"",c:["อริยสัจ 4","โอวาท 3","เบญจศีล","ไตรสิกขา"],a:1,exp:"โอวาท 3 คือ หัวใจของพระพุทธศาสนา ประกอบด้วย การไม่ทำบาปทั้งปวง การทำกุศลให้ถึงพร้อม และการทำจิตใจให้บริสุทธิ์"},
  {id:3,cat:"ศาสนา",q:"การปฏิบัติตนตามหลัก 'เบญจศีล' (ศีล 5) ข้อที่ 1 ห้ามปฏิบัติสิ่งใด?",ctx:"",c:["ห้ามพูดปด","ห้ามลักทรัพย์","ห้ามฆ่าสัตว์ตัดชีวิต","ห้ามดื่มสุราของมึนเมา"],a:2,exp:"ศีลข้อที่ 1 คือ ปาณาติปาตา เวรมณี หมายถึง การละเว้นจากการฆ่าสัตว์หรือเบียดเบียนชีวิตผู้อื่น"},
  {id:4,cat:"หน้าที่พลเมือง",q:"วันสำคัญใดจัดขึ้นเพื่อระลึกถึงพระคุณของครูอาจารย์ ตรงกับวันที่ 16 มกราคม ของทุกปี?",ctx:"",c:["วันครู","วันเด็กแห่งชาติ","วันไหว้ครู","วันวิทยาศาสตร์"],a:0,exp:"วันครูแห่งชาติ ตรงกับวันที่ 16 มกราคม ของทุกปี จัดขึ้นเพื่อระลึกถึงพระคุณของครู"},
  {id:5,cat:"หน้าที่พลเมือง",q:"การปฏิบัติตนตามกฎจราจร เช่น การข้ามถนนตรงทางม้าลาย แสดงถึงการเป็นพลเมืองดีในด้านใด?",ctx:"",c:["การมีความคิดสร้างสรรค์","การเคารพกฎหมายและระเบียบสังคม","การประหยัดอดออม","การอนุรักษ์วัฒนธรรม"],a:1,exp:"การปฏิบัติตามกฎจราจรเป็นหน้าที่พื้นฐานของพลเมืองดีในการเคารพและปฏิบัติตามกฎหมายของบ้านเมือง"},
  {id:6,cat:"หน้าที่พลเมือง",q:"ประเพณีลอยกระทงจัดขึ้นในวันเพ็ญเดือนสิบสอง โดยมีวัตถุประสงค์หลักเพื่ออะไร?",ctx:"",c:["เพื่อความสนุกสนานและรื่นเริง","เพื่อขอขมาพระแม่คงคาและระลึกถึงพระคุณของน้ำ","เพื่อกราบไหว้บรรพบุรุษที่ล่วงลับ","เพื่อเป็นการแข่งขันประกวดนางนพมาศ"],a:1,exp:"ประเพณีลอยกระทงจัดขึ้นเพื่อเป็นการขอขมาต่อพระแม่คงคา (แม่น้ำ) ที่เราได้อุปโภคบริโภคและอาจทำให้สกปรก"},
  {id:7,cat:"หน้าที่พลเมือง",q:"สัญลักษณ์ของความเป็นชาติไทยที่แสดงออกผ่านเสียงเพลง และเราต้องยืนตรงเคารพในเวลา 08.00 น. และ 18.00 น. คืออะไร?",ctx:"",c:["เพลงสรรเสริญพระบารมี","เพลงชาติไทย","เพลงกราวกีฬา","เพลงมหาฤกษ์"],a:1,exp:"เพลงชาติไทยเป็นสัญลักษณ์ที่แสดงถึงความสามัคคีและความเป็นเอกราชของชาติไทย"},
  {id:8,cat:"เศรษฐศาสตร์",q:"การปฏิบัติตามแนวคิด 'ปรัชญาเศรษฐกิจพอเพียง' ขั้นเริ่มต้นควรเริ่มจากที่ใด?",ctx:"",c:["เริ่มจากชุมชน","เริ่มจากโรงเรียน","เริ่มจากตนเองและครอบครัว","เริ่มจากระดับประเทศ"],a:2,exp:"การสร้างความพอเพียงต้องเริ่มต้นที่ตนเองและครอบครัวก่อน โดยการรู้จักความพอประมาณ มีเหตุผล และมีภูมิคุ้มกัน"},
  {id:9,cat:"เศรษฐศาสตร์",q:"ผู้ที่นำเงินไปฝากไว้กับธนาคารพาณิชย์ จะได้รับสิ่งใดเป็นผลตอบแทนหลัก?",ctx:"",c:["ของรางวัลพิเศษ","เงินกู้ยืม","ดอกเบี้ยเงินฝาก","หุ้นส่วนของธนาคาร"],a:2,exp:"ผลตอบแทนที่ผู้ฝากเงินจะได้รับจากธนาคารคือ 'ดอกเบี้ยเงินฝาก' ตามอัตราที่ธนาคารกำหนด"},
  {id:10,cat:"เศรษฐศาสตร์",q:"การเลือกซื้อสินค้าชนิดเดียวกัน ควรพิจารณาจากสิ่งใดเป็นอันดับแรกเพื่อให้คุ้มค่าที่สุด?",ctx:"",c:["ความสวยงามของบรรจุภัณฑ์","โฆษณาทางทีวีและอินเทอร์เน็ต","คุณภาพและราคาที่เหมาะสมสมเหตุสมผล","ของแถมที่มากับสินค้า"],a:2,exp:"การบริโภคที่ดีและคุ้มค่า ควรคำนึงถึงประโยชน์ คุณภาพ และราคาที่เหมาะสมเป็นหลัก"},
  {id:11,cat:"เศรษฐศาสตร์",q:"ข้อใดจัดเป็น 'ทรัพยากรส่วนรวม' ที่ทุกคนในชุมชนมีสิทธิใช้ประโยชน์ร่วมกัน?",ctx:"",c:["โทรศัพท์มือถือส่วนตัว","รถยนต์ของเพื่อนบ้าน","สวนสาธารณะในชุมชน","บ้านพักอาศัยของเรา"],a:2,exp:"สวนสาธารณะ ถนน หรือสนามเด็กเล่นของหมู่บ้าน จัดเป็นทรัพย์สินส่วนรวมที่ทุกคนใช้ประโยชน์ร่วมกันได้"},
  {id:12,cat:"ประวัติศาสตร์",q:"พระมหากษัตริย์ไทยผู้ทรงประดิษฐ์อักษรไทย (ลายสือไทย) คือพระองค์ใด?",ctx:"",c:["พ่อขุนศรีอินทราทิตย์","พ่อขุนรามคำแหงมหาราช","สมเด็จพระนเรศวรมหาราช","สมเด็จพระนารายณ์มหาราช"],a:1,exp:"พ่อขุนรามคำแหงมหาราช ทรงประดิษฐ์อักษรไทยขึ้นเมื่อ พ.ศ. 1826 ทำให้ชาติไทยมีภาษาและอักษรเป็นของตนเอง"},
  {id:13,cat:"ประวัติศาสตร์",q:"ราชธานีหรือเมืองหลวงแห่งแรกอย่างเป็นทางการของชาติไทยคือเมืองใด?",ctx:"",c:["สุโขทัย","อยุธยา","ธนบุรี","รัตนโกสินทร์"],a:0,exp:"อาณาจักรสุโขทัยได้รับการสถาปนาเป็นราชธานีแห่งแรกของไทย โดยมีพ่อขุนศรีอินทราทิตย์เป็นปฐมกษัตริย์"},
  {id:14,cat:"ประวัติศาสตร์",q:"วันสงกรานต์ของไทย ถือเป็นวันขึ้นปีใหม่ตามประเพณีดั้งเดิม ตรงกับเดือนใดของทุกปี?",ctx:"",c:["มกราคม","เมษายน","พฤษภาคม","ธันวาคม"],a:1,exp:"วันสงกรานต์ตรงกับวันที่ 13-15 เมษายน ของทุกปี ถือเป็นวันขึ้นปีใหม่ไทยตามประเพณีโบราณ"},
  {id:15,cat:"ประวัติศาสตร์",q:"บุคคลใดได้รับการยกย่องให้เป็น 'บิดาแห่งประวัติศาสตร์ไทย'?",ctx:"",c:["สมเด็จพระเจ้าบรมวงศ์เธอ กรมพระยาดำรงราชานุภาพ","สุนทรภู่","พระยาอนุมานราชธน","หลวงประดิษฐไพเราะ"],a:0,exp:"สมเด็จฯ กรมพระยาดำรงราชานุภาพ ทรงมีผลงานด้านประวัติศาสตร์และโบราณคดีไทยมากมายจนได้รับการยกย่องเป็นบิดาแห่งประวัติศาสตร์ไทย"},
  {id:16,cat:"ภูมิศาสตร์",q:"เครื่องมือทางภูมิศาสตร์ชนิดใดที่ให้ข้อมูลจำลองลักษณะของผิวโลกได้เสมือนจริงและมีลักษณะเป็นทรงกลม?",ctx:"",c:["แผนที่แบน","ลูกโลกจำลอง","เข็มทิศ","กล้องส่องทางไกล"],a:1,exp:"ลูกโลกจำลองคือหุ่นจำลองของโลกที่สะท้อนสัดส่วน รูปร่าง และตำแหน่งของทวีปและมหาสมุทรได้อย่างถูกต้องที่สุด"},
  {id:17,cat:"ภูมิศาสตร์",q:"หากเราหันหน้าไปทางทิศตะวันออก ด้านหลังของเราจะเป็นทิศใด?",ctx:"",c:["ทิศเหนือ","ทิศใต้","ทิศตะวันตก","ทิศตะวันออกเฉียงเหนือ"],a:2,exp:"ทิศตะวันออกจะอยู่ตรงข้ามกับทิศตะวันตกเสมอ ดังนั้นถ้าหันหน้าหาทิศตะวันออก ด้านหลังจะเป็นทิศตะวันตก"},
  {id:18,cat:"ภูมิศาสตร์",q:"การตัดไม้ทำลายป่าบริเวณพื้นที่ต้นน้ำ จะส่งผลให้เกิดภัยธรรมชาติใดร้ายแรงที่สุดในฤดูฝน?",ctx:"",c:["แผ่นดินไหว","ภูเขาไฟระเบิด","น้ำป่าไหลหลากและดินโคลนถล่ม","ภัยแล้งอย่างรุนแรง"],a:2,exp:"ป่าไม้ช่วยชะลอและดูดซับน้ำฝน หากไม่มีต้นไม้ น้ำฝนจะไหลบ่าลงมาอย่างรวดเร็วเกิดเป็นน้ำป่าและดินถล่ม"},
  {id:19,cat:"ภูมิศาสตร์",q:"ขยะประเภทใดที่ควรแยกใส่ในถังขยะสีเขียว (ขยะย่อยสลายหรือขยะอินทรีย์)?",ctx:"",c:["ขวดแก้วและกระป๋องน้ำอัดลม","เศษอาหารและเปลือกผลไม้","ถุงพลาสติกและโฟม","ถ่านไฟฉายและหลอดไฟ"],a:1,exp:"ถังขยะสีเขียวใช้สำหรับขยะอินทรีย์ที่ย่อยสลายได้ง่าย เช่น เศษอาหาร เศษผัก เปลือกผลไม้ และใบไม้"},
  {id:20,cat:"หน้าที่พลเมือง",q:"หากนักเรียนเก็บกระเป๋าเงินได้ในโรงเรียน สิ่งที่ควรกระทำเป็นอันดับแรกตามหลักคุณธรรมคืออะไร?",ctx:"",c:["นำเงินข้างในไปซื้อขนมแบ่งเพื่อน","เก็บเงียบไว้กับตัวไม่บอกใคร","นำไปมอบให้ครูประชาสัมพันธ์เพื่อประกาศตามหาเจ้าของ","วางทิ้งไว้ที่เดิมไม่ต้องสนใจ"],a:2,exp:"การนำของที่เก็บได้ไปแจ้งคุณครูเพื่อคืนเจ้าของ แสดงถึงความซื่อสัตย์สุจริตอันเป็นคุณธรรมพื้นฐานของพลเมืองดี"}
];
const totalQ = Q.length;
const L=['A','B','C','D'];
let s={screen:'start',cur:0,ans:Array(totalQ).fill(null),done:Array(totalQ).fill(false)};
function score(){return s.ans.reduce((t,a,i)=>t+(a===Q[i].a?1:0),0)}
function render(){document.getElementById('app').innerHTML=s.screen==='start'?startH():s.screen==='result'?resultH():quizH()}

function startH(){
  return `<div class="start-wrap">
    <span class="start-icon">🌍</span>
    <div class="start-title">แบบทดสอบสังคมศึกษา ชุดที่ 1</div>
    <div class="start-sub">สำหรับนักศึกษา สกร. ระดับประถมศึกษา<br>ทดสอบความรู้พื้นฐาน 5 สาระวิชา จำนวน ${totalQ} ข้อ</div>
    <div class="pills">
      <span class="pill">📝 ${totalQ} ข้อ</span>
      <span class="pill">✅ เฉลยทุกข้อ</span>
      <span class="pill">🏆 สรุปคะแนน</span>
      <span class="pill">🔄 ทำซ้ำได้</span>
    </div>
    <div class="topic-box">
      <div class="topic-head">หัวข้อหลักในชุดนี้:</div>
      ${['วันสำคัญและหลักธรรมทางศาสนา','การปฏิบัติตนและประเพณีไทย','เศรษฐกิจพอเพียงและการออมเงิน','ประวัติศาสตร์และบุคคลสำคัญของไทย','เครื่องมือภูมิศาสตร์และสิ่งแวดล้อม'].map(t=>`<div class="topic-row"><span class="topic-dot"></span>${t}</div>`).join('')}
    </div>
    <button class="btn-start" onclick="go()">เริ่มทำแบบทดสอบ ▶</button>
  </div>`}

function quizH(){
  const q=Q[s.cur],pct=Math.round(((s.cur+1)/totalQ)*100),done=s.done[s.cur],sel=s.ans[s.cur];
  const choices=q.c.map((c,i)=>{
    let cls='choice'+(done?(i===q.a?' correct':(i===sel&&sel!==q.a?' wrong':'')):(i===sel?' selected':''));
    return `<button class="${cls}"${done?' disabled':''} onclick="pick(${i})"><span class="cletter">${L[i]}</span>${c}</button>`;
  }).join('');
  const fb=done?`<div class="feedback ${sel===q.a?'ok':'no'} show">${sel===q.a?'✅ <strong>ถูกต้อง!</strong>':'❌ <strong>ไม่ถูกต้อง</strong> — คำตอบที่ถูกคือ <strong>'+q.c[q.a]+'</strong>'}<span class="fb-explain">💡 ${q.exp}</span></div>`:'';
  const navLeft=s.cur>0?`<button class="btn btn-secondary" onclick="prev()">← ย้อนกลับ</button>`:`<div></div>`;
  const navRight=done?(s.cur===totalQ-1?`<button class="btn btn-primary" onclick="result()">ดูผลคะแนน 🏆</button>`:`<button class="btn btn-primary" onclick="next()">ถัดไป →</button>`):(`<button class="btn btn-primary"${sel===null?' disabled':''} onclick="${sel!==null?'confirm()':''}">ตรวจคำตอบ ✓</button>`);
  const dots=Q.map((_,i)=>{let c=i===s.cur?'dot-active':s.done[i]?(s.ans[i]===Q[i].a?'dot-ok':'dot-no'):'dot-idle';return`<button class="dot ${c}" onclick="jump(${i})">${i+1}</button>`}).join('');
  return `
    <div class="prog-card">
      <div class="prog-info">
        <div class="prog-lbl">ข้อที่ ${s.cur+1} จาก ${totalQ}</div>
        <div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="prog-right"><div class="prog-num">${s.cur+1}/${totalQ}</div><div class="prog-sub">✅ ${s.ans.filter(a=>a!==null).length} ตอบแล้ว</div></div>
    </div>
    <div class="q-card">
      <div class="q-badge">${q.cat}</div>
      <div class="q-num-circle">${s.cur+1}</div>
      ${q.ctx?`<div class="q-context">${q.ctx}</div>`:''}
      <div class="q-text">${q.q}</div>
      <div class="choices">${choices}</div>
      ${fb}
      <div class="nav">${navLeft}${navRight}</div>
    </div>
    <div class="dotnav">${dots}</div>`}

function resultH(){
  const sc=score(),pct=Math.round(sc/totalQ*100);
  let grade,gc,msg,icon;
  if(pct>=80){grade='ดีมาก (A)';gc='grade-A';msg='ยอดเยี่ยม! มีความรู้รอบตัวดีมากครับ';icon='🏆'}
  else if(pct>=60){grade='ดี (B)';gc='grade-B';msg='ทำได้ดีเลยครับ ฝึกฝนเพิ่มเติมอีกนิดนะ';icon='⭐'}
  else if(pct>=50){grade='พอใช้ (C)';gc='grade-C';msg='ผ่านเกณฑ์ขั้นต่ำ ควรทบทวนเนื้อหาเพิ่มเติม';icon='📘'}
  else{grade='ต้องปรับปรุง (D)';gc='grade-D';msg='ตั้งใจศึกษาใหม่และลองทำซ้ำอีกครั้งนะครับ';icon='📖'}
  const review=Q.map((q,i)=>{
    const ok=s.ans[i]===q.a,ua=s.ans[i]!==null?q.c[s.ans[i]]:'(ไม่ตอบ)';
    return`<div class="ri"><div class="ri-q"><span class="ri-tick ${ok?'ri-ok':'ri-no'}">${ok?'✓':'✗'}</span>ข้อ ${i+1}: ${q.q}</div><div class="ri-user">คุณตอบ: ${ua}</div><div class="ri-correct">✅ เฉลย: ${q.c[q.a]}</div><div class="ri-exp">💡 ${q.exp}</div></div>`}).join('');
  return `
  <div class="result-wrap">
    <span class="result-icon">${icon}</span>
    <div class="score-big">${sc}</div>
    <div class="score-denom">จาก ${totalQ} ข้อ</div>
    <div class="score-pct">${pct}%</div>
    <span class="grade-pill ${gc}">${grade}</span>
    <div class="result-msg">${msg}</div>
    <div class="stats">
      <div class="sbox"><div class="snum green">${sc}</div><div class="slbl">ตอบถูก</div></div>
      <div class="sbox"><div class="snum red">${totalQ-sc}</div><div class="slbl">ตอบผิด</div></div>
      <div class="sbox"><div class="snum blue">${pct}%</div><div class="slbl">คะแนน</div></div>
    </div>
    <button class="btn-retry" onclick="reset()">🔄 ทำแบบทดสอบอีกครั้ง</button>
    <div class="review-title">📋 เฉลยและคำอธิบายทุกข้อ</div>
    ${review}
  </div>`}

function go(){s.screen='quiz';render()}
function pick(i){if(s.done[s.cur])return;s.ans[s.cur]=i;render()}
function confirm(){if(s.ans[s.cur]===null)return;s.done[s.cur];s.done[s.cur]=true;render()}
function next(){if(s.cur<totalQ-1){s.cur++;render()}}
function prev(){if(s.cur>0){s.cur--;render()}}
function jump(i){s.cur=i;render()}
function result(){s.screen='result';render()}
function reset(){s={screen:'start',cur:0,ans:Array(totalQ).fill(null),done:Array(totalQ).fill(false)};render()}
render();
</script>
</body>
</html>
